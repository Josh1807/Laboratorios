</head>

<body>
  <!-- Encabezado de cuerpo de la pagina -->
  <header>
    <h1 id="main-title" class="title">Plataforma de Reserva de Consolas</h1>
    <!-- Menu -->
    <nav class="nav-menu">
      <ul class="nav-list">
        <li class="menu-item"><a href="Index.html">Inicio</a></li>

        <li class="menu-item"><a href="Login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido">
    <section>
      <form action="#" method="post">
        <fieldset>
          <legend>Registro para Reserva</legend>

          <div class="form-group">
            <label for="username">Nombre de Usuario:</label>
            <input class="form-input" type="text" id="username" name="username" required>

            <label for="email">Correo Electrónico:</label>
            <input class="form-input" type="email" id="email" name="email" required>

            <label for="password">Contraseña:</label>
            <input class="form-input" type="password" id="password" name="password" required>

            <label for="consola">Consola:</label>
            <input class="form-input" type="text" id="consola" name="consola" required>

            <label for="disponibilidad">Stock:</label>
            <input class="form-input" type="number" id="disponibilidad" name="disponibilidad" required>
          </div>
          </main>
